name: End-to-end tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site URL to test
        required: true
        default: https://startup-sense-ai.netlify.app
      only:
        description: Comma-separated test ids to run (A,B,C,D,E,X) — empty = all
        required: false
        default: ""

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          ONLY: ${{ inputs.only }}
          NODE_PATH: /tmp/pw/node_modules
        run: node tests/e2e.mjs
      - name: Publish results to e2e-results branch
        if: always()
        run: |
          cd e2e-output
          git init -q
          git checkout -q -b e2e-results
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "E2E results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" e2e-results
