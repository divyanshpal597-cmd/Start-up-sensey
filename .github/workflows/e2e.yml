name: End-to-end tests

# Runs when .ci/e2e-trigger changes on main. That file holds BASE_URL and ONLY (test ids).
on:
  push:
    branches: [main]
    paths: [".ci/e2e-trigger"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for any running deploy to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20
          for i in $(seq 1 60); do
            n=$(gh run list -R "${{ github.repository }}" --workflow deploy.yml --json status -q '[.[] | select(.status != "completed")] | length')
            echo "deploys in progress: $n"
            [ "$n" = "0" ] && break
            sleep 15
          done
      - name: Run tests
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          ln -s /tmp/pw/node_modules node_modules
          set -a; source .ci/e2e-trigger; set +a
          mkdir -p e2e-output
          set -o pipefail
          node tests/e2e.mjs 2>&1 | tee e2e-output/run.log
      - name: Publish results to e2e-results branch
        if: always()
        run: |
          cd e2e-output
          git init -q
          git checkout -q -b e2e-results
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "E2E results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" e2e-results
